[project]
name = "forma-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery==2.8.0", "numpy==2.2.6", "scipy==1.15.3", "sympy==1.14.0",
  "pint==0.24.4", "mpmath==1.3.0", "cvxpy==1.6.6", "matplotlib==3.10.3",
  "trimesh==4.6.10", "pydantic==2.11.5", "nbclient==0.10.2", "ipykernel==6.29.5",
  # Newer CasADi wheels conflict with NLopt at process shutdown on this Windows runtime.
  # Linux sandbox dependencies remain independently locked in uv.lock.
  "casadi==3.6.7; sys_platform == 'win32'"
]
[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.12", "mypy==1.15.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
