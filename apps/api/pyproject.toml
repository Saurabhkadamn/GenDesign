[project]
name = "forma-api"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "cryptography==50.0.1",
  "vercel==0.10.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langsmith==0.12.1",
  "psycopg[binary,pool]==3.2.10",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.vercel]
entrypoint = "forma_api.main:app"

[[tool.vercel.workflows]]
entrypoint = "forma_api.workflows:wf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
